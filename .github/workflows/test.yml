name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install locked deployment and test tools
        run: python -m pip install -r requirements-dev.txt uv==0.13.1
      - run: python scripts/lock_dependencies.py --check
      - run: python -m pytest
      - run: python -m compileall -q app.py src
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify built wheel without sibling checkouts or overrides
        run: |
          python -m venv /tmp/plane-wheel
          /tmp/plane-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/plane-wheel/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
