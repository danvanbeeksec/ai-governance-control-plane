[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-governance-control-plane"
version = "0.7.0"
description = "Deterministic AI governance assessment and control applicability service"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dan Van Beek" }]
dependencies = [
  "PyYAML>=6.0.3,<7",
  "pydantic>=2.13.4,<3",
  "ai-governance-control-framework @ git+https://github.com/danvanbeeksec/ai-governance-control-framework.git@9f400a150396b79b1624660c111bcfd89a0d902c",
]

[project.optional-dependencies]
web = ["streamlit>=1.61.1,<2"]

[project.urls]
Repository = "https://github.com/danvanbeeksec/ai-governance-control-plane"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ai_governance_control_plane"]

[tool.hatch.build.targets.wheel.force-include]
"data/risk-model.yaml" = "ai_governance_control_plane/resources/risk-model.yaml"
"data/control-applicability-rules.yaml" = "ai_governance_control_plane/resources/control-applicability-rules.yaml"
"data/framework-source.yaml" = "ai_governance_control_plane/resources/framework-source.yaml"

[tool.pytest.ini_options]
pythonpath = ["src"]
